plugins {
    id 'com.android.application' version '8.7.3'
}

android {
    namespace 'com.greeklish.keyboard'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.greeklish.keyboard'
        minSdk 26
        targetSdk 35
        versionCode 8
        versionName '0.4.2'
        // All modern phones are arm64. Add 'x86_64' to run in a PC emulator.
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    androidResources { noCompress 'onnx' }
    // Store the ONNX Runtime library compressed: much smaller APK to copy to the phone.
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.31.1'
}

